name: price-monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 알림 발송/상태 커밋 없이 콘솔 출력만 수행"
        type: boolean
        default: false

concurrency:
  group: price-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r price-monitor/requirements.txt

      - name: Run monitor
        working-directory: price-monitor
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 run.py --dry-run
          else
            python3 run.py
          fi

      - name: Commit updated state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "price-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price-monitor/state.json
          git diff --cached --quiet || git commit -m "chore(price-monitor): update state"
          git diff --cached --quiet || git push
